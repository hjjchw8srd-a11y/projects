[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "image-dataset-builder"
version = "0.3.0"
description = "Image dataset collector with duplicate filtering and train/test splitting"
readme = "README.md"
requires-python = ">=3.10"
authors = [
    {name = "Contributors"},
]
dependencies = [
    "ddgs>=9.14.4,<10",
    "Pillow>=12.3.0,<13",
    "requests>=2.34.2,<3",
]

[project.scripts]
image-dataset-builder = "image_dataset_builder.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["image_dataset_builder*"]
